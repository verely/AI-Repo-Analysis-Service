name: OIDC test (temporary)

# Manual run only. Delete this file after Stage 2 is verified.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      # DEBUG: print the claims GitHub sends to AWS (sub/aud/iss are not secret).
      # The "sub" below must match the trust policy condition EXACTLY.
      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,json,base64; p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c[k] for k in ('sub','aud','iss')}, indent=2))" "$TOKEN"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::276115452343:role/github-actions-eb-deploy
          aws-region: eu-central-1

      - name: Who am I?
        run: aws sts get-caller-identity
